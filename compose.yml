name: ${APP_SLUG}-${ENVIRONMENT}

services:
  app:
    container_name: ${APP_SLUG}-${ENVIRONMENT}
    image: ${IMAGE}:${IMAGE_TAG}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
